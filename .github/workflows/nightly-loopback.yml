name: Nightly Remote-Control Loopback
# Also the RELEASE E2E GATE: release.yml calls this via `workflow_call` (job
# `e2e-gate`) and refuses to build/publish until it passes. Everything a gate
# needs beyond the two tiers' own verdicts lives here too: process survival,
# fresh crash reports, SLS hit-test evidence, and an explicit quarantine list
# (E2E_QUARANTINE_*) so a known, tracked failure is reported LOUDLY but does
# not block a release -- while any new failure does.
#
# TWO TIERS, TWO WEB TARGETS. The loopback tier is hermetic: local
# livekit-server plus a local vite web-harness built from THIS checkout, so it
# already exercises the web source the release is about to ship. The Test
# Cockpit tier talks to a real deployment over https, and which one is an
# input (#42) -- production for a dispatch run, the staged pre-promotion
# deployments when release.yml's `e2e-gate` passes them.
#
# SECURITY: never attach this to `pull_request`. It runs on the self-hosted
# Tart runner; a third-party PR would execute on that machine. Manual
# dispatch and the maintainer-only `v*` tag push are the only triggers.

on:
  # STATUS NOTE (2026-07-14): the nightly `schedule` trigger is disabled --
  # no self-hosted macOS runner has ever been registered for this repo, so
  # every scheduled run just sat cancelled/pending for at least 5 straight
  # days (pure clutter, zero signal). Manual dispatch still works once a
  # runner is registered per the job's own setup comment below; restore the
  # schedule trigger at that point:
  #   schedule:
  #     - cron: "17 10 * * *"
  # TARGETING (#42). Both callers share this workflow, and they want different
  # web targets, so it is an input with a PRODUCTION default:
  #   * manual/nightly dispatch -> the defaults below, i.e. the live domains.
  #     That is the point of a nightly: it observes drift between what is
  #     deployed and what `main` says should be deployed.
  #   * release.yml's `e2e-gate` -> the STAGED deployment URLs `deploy-web`
  #     just created, so the gate tests the web build this release is about
  #     to promote instead of the previous one.
  # A staged deployment sits behind Vercel deployment protection; see
  # `vercel_bypass_secret` below. The bypass covers only what the BROWSER
  # navigates to. The web peer's cross-origin token mint against the backend is
  # a separate gate that `deploy-web` checks with
  # scripts/verify-web-peer-origin.sh (#42 follow-up: v0.9.10's six INFRA-FAILs
  # were a 403 there, not a failed bypass).
  workflow_dispatch:
    inputs:
      harness_url:
        description: "web-harness origin the Test Cockpit's web peers load (default: production meet.petal.live)"
        required: false
        default: "https://meet.petal.live"
        type: string
      backend_url:
        description: "Petal backend the Test Cockpit's native peer mints tokens from (default: production app.petal.live)"
        required: false
        default: "https://app.petal.live"
        type: string
      cockpit_selector:
        description: "Test Cockpit selector for the QA-featured tier: a tier (quick) or a comma-separated scenario id list (e.g. SHARE-W2N-STALL for #202's soak measurement)"
        required: false
        default: "quick"
        type: string
      stall_freeze_ms:
        description: "SHARE-W2N-STALL: how long the browser sharer freezes its source, ms (10000-900000; default 90000)"
        required: false
        default: ""
        type: string
      stall_resume_ms:
        description: "SHARE-W2N-STALL: how long the receiver gets to resume after the source does, ms (10000-900000; default 30000)"
        required: false
        default: ""
        type: string
      gate:
        description: "Run with release-gate strictness: a runner without the Cockpit setup marker FAILS instead of skipping the Cockpit tier"
        required: false
        default: false
        type: boolean
      rc_test_replay_delay_ms:
        description: "RED-PROOF ONLY: stall every host remote-control replay by this many ms (debug build knob PETAL_RC_TEST_REPLAY_DELAY_MS) to prove the latency gate fails. Leave empty."
        required: false
        default: ""
        type: string
      net_delay_ms:
        description: "RED-PROOF ONLY (#378): override the impaired pass's one-way delay per SFU traversal (default PETAL_NET_IMPAIR_DELAY_MS). Budgets stay fixed, so a larger value must fail the network stages. Leave empty."
        required: false
        default: ""
        type: string
      net_loss_pct:
        description: "RED-PROOF ONLY (#378): override the impaired pass's loss % each way (default PETAL_NET_IMPAIR_LOSS_PCT). Leave empty."
        required: false
        default: ""
        type: string
      freeze_probe_red_pause_ms:
        description: "RED-PROOF ONLY (#378): pause the freeze probe's animated source this many ms mid-probe to prove the presented-freeze check fails. Leave empty."
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (release.yml passes the release tag); defaults to the caller's ref"
        required: false
        type: string
      harness_url:
        description: "web-harness origin the Test Cockpit's web peers load (default: production meet.petal.live)"
        required: false
        default: "https://meet.petal.live"
        type: string
      backend_url:
        description: "Petal backend the Test Cockpit's native peer mints tokens from (default: production app.petal.live)"
        required: false
        default: "https://app.petal.live"
        type: string
      cockpit_selector:
        description: "Test Cockpit selector for the QA-featured tier: a tier (quick) or a comma-separated scenario id list (e.g. SHARE-W2N-STALL for #202's soak measurement)"
        required: false
        default: "quick"
        type: string
      stall_freeze_ms:
        description: "SHARE-W2N-STALL: how long the browser sharer freezes its source, ms (10000-900000; default 90000)"
        required: false
        default: ""
        type: string
      stall_resume_ms:
        description: "SHARE-W2N-STALL: how long the receiver gets to resume after the source does, ms (10000-900000; default 30000)"
        required: false
        default: ""
        type: string
      # A called workflow cannot tell from `github.event_name` that it is the
      # release gate (that reads as the CALLER's event), so strictness is an
      # explicit input. It defaults to TRUE here: the only caller is the
      # release gate, and a new caller should have to opt OUT of strictness.
      gate:
        description: "Release-gate strictness: a runner without the Cockpit setup marker FAILS instead of skipping the Cockpit tier"
        required: false
        default: true
        type: boolean
    secrets:
      vercel_bypass_secret:
        description: "Vercel Protection Bypass for Automation secret, required ONLY when harness_url/backend_url point at a protected staged deployment. Empty for production targets."
        required: false

concurrency:
  group: nightly-loopback-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-loopback:
    name: Live remote-control loopback
    # Repo owner setup required: register a self-hosted macOS runner with these
    # labels, logged in at a real display, with Chrome installed, livekit-server
    # on PATH, and Accessibility/Screen Recording grants already approved for
    # the Petal dev binary and the terminal/runner service that launches it.
    runs-on: [self-hosted, macOS]
    # #102: there was NO job timeout at all, so GitHub's 6-hour default applied
    # and one wedged run held the single self-hosted Tart VM for 81 minutes with
    # a release e2e gate queued behind it -- which then failed that release's
    # queue watchdog and cost a version number. Healthy runs of this job take
    # 6-12 minutes (observed across the last twelve: 5.9, 6.8, 6.9, 7.0, 7.4,
    # 9.0, 9.0, 9.2, 9.3, 9.4, 11.9), so 45 leaves roughly 4x headroom -- enough
    # for a cold runner that has to rebuild the Rust app -- while capping the
    # worst case at under an hour instead of six.
    timeout-minutes: 45
    env:
      # Match .github/workflows/ci.yml's desktop Rust build recipe.
      RUSTFLAGS: ""
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      CARGO_INCREMENTAL: 0
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      PETAL_DISABLE_AUDIO: 1
      PETAL_AUTOTEST_ROOM: rctest
      # Autotest rooms are ownership-checked: an unknown QA key is refused
      # ("no ownership record"). FRESH_ROOM=1 creates a dedicated test room,
      # exactly as scripts/rc-live-suite.sh launches Petal (#916, first VM run).
      PETAL_AUTOTEST_FRESH_ROOM: "1"
      PETAL_ACCESSORY_UI: "1"
      PETAL_AUTOTEST_IDENTITY: native-autotest
      PETAL_AUTOTEST_NAME: Native Autotest
      PETAL_WEB_HARNESS_URL_MATCH: localhost:5185
      # #45: target-observation latency allowance for THIS runner only. The
      # observation path (TextEdit driven through AppleEvents/Accessibility)
      # runs measurably slower inside the Tart guest than on bare metal, so the
      # 500ms default sat right on top of the guest's healthy distribution:
      # runs 34078048040 and 34081151407 measured a healthy p95 of 460.3ms and
      # 459.3ms. 620ms is that measurement plus ~35% headroom -- deliberately
      # NOT wide enough to swallow those runs' 605.3ms/699.2ms outliers, which
      # the scenario's one retry handles instead. A systemic slowdown moves the
      # median and still fails the gate, and every sample (rescued outliers
      # included) is reported in SUMMARY.targetObservationLatency.
      # Bare metal keeps the 500ms default; do not raise this globally.
      PETAL_RC_OBSERVATION_BUDGET_MS: "620"
      # RUN-LEVEL LATENCY GATE (scripts/ci/remote-control-latency-verdict.mjs,
      # the `latency` tier of e2e-gate-verdict.mjs). Remote control of a shared
      # window is the pair-programming core, so the distribution is enforced,
      # not just reported. Each check fails on a breach AND on too few samples.
      # Healthy VM runs 39043717521/39045769685/39048480276/39052137479/
      # 39053559914 (photon only from 39052137479 on, after the sentinel fix):
      #   observation p50 48-108, p95 149-232     -> 200 / 400 (~1.7-1.9x)
      #   host receive->inject p95 8-10           -> 40
      #   host receive->replay complete p95 93-106 -> 200 (~1.9x)
      #   web send->host inject p95 10-12         -> 50
      #   press-to-photon p50 139-189, p95 239-288 -> 250 / 400. The p50 is
      #     the discriminating check (green max 188.5 vs red 337.5, red run
      #     39056551241, 150ms host stall). p95 has 1.4x headroom because a
      #     repeatable ~788ms text outlier shows up in 2 of 3 green runs and a
      #     40-sample nearest-rank p95 tolerates only two. A missed photon
      #     sample scores as its 2000ms timeout; more than 2 misses fails.
      # Red run 39056551241 (rc_test_replay_delay_ms=150) fails all seven at
      # these budgets (photon p95 only just: 402.5 > 400; the photon p50 is the
      # reliable photon signal). Raise budgets only with new VM evidence.
      PETAL_RC_OBSERVATION_DISTRIBUTION_SAMPLES: "3"
      PETAL_RC_OBSERVATION_P50_BUDGET_MS: "200"
      PETAL_RC_OBSERVATION_P95_BUDGET_MS: "400"
      PETAL_RC_HOST_RECEIVE_TO_INJECT_P95_BUDGET_MS: "40"
      PETAL_RC_HOST_RECEIVE_TO_COMPLETE_P95_BUDGET_MS: "200"
      PETAL_RC_SEND_TO_INJECT_P95_BUDGET_MS: "50"
      PETAL_RC_PHOTON_P50_BUDGET_MS: "250"
      PETAL_REMOTE_CONTROL_PHOTON_P95_BUDGET_MS: "400"
      # #378 PRESENTED-VIDEO FREEZE. After the photon samples the sentinel
      # animates at 30Hz for PETAL_RC_FREEZE_PROBE_MS and the web viewer's
      # requestVideoFrameCallback gaps are scored: no presented frame for
      # > 500ms while the source is moving is a freeze a user sees. Same
      # budget clean and impaired -- a network that freezes video is the bug.
      PETAL_RC_FREEZE_PROBE_MS: "20000"
      PETAL_RC_PRESENTED_FREEZE_BUDGET_MS: "500"
      # #378 IMPAIRED PASS. The loopback runs on localhost (0ms, lossless),
      # which no meeting has. After the clean pass the same suites run again
      # with dummynet on the LiveKit ports (scripts/ci/net-impair.sh): every
      # participant gets 20ms each way to the SFU (40ms RTT -- a good home
      # connection to an in-region SFU) and 1% loss each way (~2% end to end
      # over the two hops of a meeting: ordinary Wi-Fi, not a bad network).
      # REPORT-ONLY until #399's fix (#421) lands: the impaired pass and the
      # presented-freeze check run and publish their verdicts (REPORT-ONLY:
      # would fail) but block the gate only when this is "true".
      E2E_IMPAIRED_BLOCKING: "false"
      PETAL_NET_IMPAIR_DELAY_MS: "20"
      PETAL_NET_IMPAIR_LOSS_PCT: "1"
      # Impaired budgets are the clean ones plus the delay the profile adds on
      # the stage's path -- 2 traversals for an input (controller->SFU->host),
      # 4 for press-to-photon (input there, video back) -- and nothing for
      # loss: loss that slows the median or the tail is a finding, not noise.
      # Host-only stages keep the clean budgets (the network is not on their
      # path; the attribution verdict also checks they did not move). Fixed
      # constants: a red-proof raises net_delay_ms and must FAIL these.
      IMPAIRED_OBSERVATION_BUDGET_MS: "660"     # 620 + 2x20
      IMPAIRED_OBSERVATION_P50_MS: "240"        # 200 + 2x20
      IMPAIRED_OBSERVATION_P95_MS: "440"        # 400 + 2x20
      IMPAIRED_SEND_TO_INJECT_P95_MS: "90"      #  50 + 2x20
      IMPAIRED_PHOTON_P50_MS: "330"             # 250 + 4x20
      IMPAIRED_PHOTON_P95_MS: "480"             # 400 + 4x20
      # QUARANTINE (release gate). Comma-separated. A listed failure is
      # printed as a ::warning "QUARANTINED" -- never counted as a pass -- and
      # does not fail the gate; anything NOT listed does. Every entry needs a
      # tracking issue; remove the entry when the issue closes.
      # SHARE-DESKTOP is quarantined for its FIRST runs, deliberately (#106).
      # It is brand new, it is the only scenario that captures a whole display,
      # and it is the only one that holds a share past 30s -- none of which has
      # ever run on this VM. Quarantined it still runs, still writes its
      # `display-share-source` geometry and its `share-memory-marks` evidence
      # into run.jsonl, and still prints LOUDLY as ::warning on failure; what it
      # cannot do is block a release on a scenario nobody has watched succeed
      # yet. Remove this entry once it has passed several consecutive runs --
      # #106 is its tracking issue.
      E2E_QUARANTINE_COCKPIT: "SHARE-DESKTOP"
      E2E_QUARANTINE_RC_CASES: ""
      # Cases that must PASS (scripts/ci/e2e-gate-verdict.mjs --required): a
      # skip, a missing result or a fail -- quarantined or not -- fails the
      # gate. 37-41 are the whole-display share cases: macOS display-share
      # pointer input went to placeholder pid 1 (#334/#349) and its
      # keyboard/text was never delivered (#335/#353) while every window case
      # stayed green. 42 repeats a scroll inside the AX scroll-cache window:
      # the host deadlocked there and replayed nothing after it (#311/#390).
      # To quarantine one, remove it from this list first.
      E2E_REQUIRED_RC_CASES: "37,38,39,40,41,42"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            web-harness/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install desktop deps
        working-directory: apps/desktop
        run: npm ci

      - name: Check desktop frontend
        working-directory: apps/desktop
        run: npm run check

      - name: Build desktop frontend
        working-directory: apps/desktop
        env:
          # The Test Cockpit's test-pattern pages live under routes/dev/**,
          # which a plain build strips (COCKPIT_RUNBOOK "Build requirements").
          PETAL_INCLUDE_DEV_ROUTES: "1"
        run: npm run build

      - name: Build desktop Rust app
        working-directory: apps/desktop/src-tauri
        run: cargo build --locked

      - name: Run Test Cockpit Quick tier when QA grants are present
        # Test Cockpit commands are compiled only in the QA/privileged build
        # (`cockpit-privileged`). Self-hosted CI can run Quick when the local
        # setup marker/TCC grants are present; Full/Soak chaos scenarios that
        # need sudo net impairment, multiple displays, or test-peer TCC grants
        # must skip here until the runner is provisioned for those capabilities.
        #
        # #42: the web target is an input, not a constant. Step-level env (not
        # job-level) so a staged URL cannot leak into the loopback tier below,
        # which is deliberately hermetic (local LiveKit + local vite harness).
        # PETAL_VERCEL_BYPASS_SECRET is a GitHub secret: Actions masks it in
        # the log, and the scrub step at the end of this job removes it from
        # the uploaded artifacts, which masking does NOT cover.
        env:
          COCKPIT_HARNESS_URL: ${{ inputs.harness_url || 'https://meet.petal.live' }}
          COCKPIT_BACKEND_URL: ${{ inputs.backend_url || 'https://app.petal.live' }}
          # #202: which scenarios the QA-featured tier runs (the release gate
          # always runs the Quick tier), and SHARE-W2N-STALL's phase lengths.
          # Empty means the engine's gate-sized defaults.
          COCKPIT_SELECTOR: ${{ inputs.cockpit_selector || 'quick' }}
          PETAL_COCKPIT_STALL_FREEZE_MS: ${{ inputs.stall_freeze_ms || '' }}
          PETAL_COCKPIT_STALL_RESUME_MS: ${{ inputs.stall_resume_ms || '' }}
          # 1 when this run IS the release gate (release.yml / workflow_call
          # default), 0 for a plain manual dispatch.
          E2E_GATE: ${{ inputs.gate && '1' || '0' }}
          # The `||` is what makes a protected staged target reproducible BY
          # HAND. A `workflow_call` from release.yml supplies
          # `vercel_bypass_secret`; a `workflow_dispatch` cannot (a secret must
          # never be a plaintext input), and in a called workflow a repo secret
          # that was not passed reads as empty -- so exactly one side is ever
          # non-empty. Without this, dispatching the gate at a staged URL to
          # reproduce a gate failure silently ran with no bypass at all.
          PETAL_VERCEL_BYPASS_SECRET: ${{ secrets.vercel_bypass_secret || secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          # The verdict lives in a script (unit-tested both directions). A
          # dispatch that pairs this workflow with an older tree lacking it
          # must fail as CANNOT CHECK, never fall back to a laxer check.
          VERDICT="scripts/ci/e2e-gate-verdict.mjs"
          if [ ! -f "$VERDICT" ]; then
            echo "::error::CANNOT CHECK: $VERDICT is not in this checkout, so no Cockpit verdict can be computed. Dispatch a ref that contains it."
            exit 1
          fi

          MARKER="$HOME/Library/Application Support/com.petal.app/.cockpit-setup-complete"
          if [ ! -f "$MARKER" ]; then
            # As the release gate, a runner that cannot run the tier is a
            # FAILURE: skipping with exit 0 let a broken runner ship a release
            # with half the gate unrun. A manual dispatch keeps the notice.
            if [ "$E2E_GATE" = "1" ]; then
              echo "::error::Test Cockpit Quick tier CANNOT RUN: the cockpit setup marker is missing on this runner ($MARKER). The release gate does not pass with a tier unrun. Run scripts/cockpit-setup.sh on the self-hosted Mac (or re-provision the Tart golden image)."
              exit 1
            fi
            echo "::notice::Skipping Test Cockpit Quick tier: cockpit setup marker is missing on this runner (manual dispatch, gate=false)."
            echo "::notice::Run scripts/cockpit-setup.sh on the self-hosted Mac to enable QA-featured cockpit runs."
            exit 0
          fi

          echo "==> Run QA-featured Test Cockpit Quick tier"
          CRASH_MARK="$RUNNER_TEMP/cockpit-start.mark"; touch "$CRASH_MARK"
          # macOS re-asks for screen-capture consent on its own schedule, and
          # the alert OCCLUDES the capture region rather than failing the job
          # (#234: it scored SHARE-W2N-STALL test-fail on the 0.9.28 release
          # while the media half was healthy). Answer it for as long as the
          # scenarios run; the script explains why here is the only place the
          # click is permitted.
          CONSENT_LOG="$RUNNER_TEMP/capture-consent-dismisser.log"
          CONSENT_STOP="$RUNNER_TEMP/capture-consent-dismisser.stop"
          bash scripts/ci/dismiss-capture-consent.sh "$CONSENT_LOG" "$CONSENT_STOP" &
          CONSENT_PID=$!
          # Stop it however this step ends, and never let its teardown mask the
          # engine's own exit code.
          trap 'touch "$CONSENT_STOP" 2>/dev/null || true; kill "$CONSENT_PID" 2>/dev/null || true' EXIT
          # The Cockpit runs against a REAL deployment (backend-minted tokens,
          # web peer served over https) -- production by default, the staged
          # pre-promotion deployments when release.yml passes them (#42). The
          # job-level LIVEKIT_* vars exist for the local loopback tier below
          # and must not leak in here: with LIVEKIT_URL set the app dials that
          # (localhost:7880, refused -- first VM run, #916).
          echo "cockpit web target: $COCKPIT_HARNESS_URL"
          echo "cockpit backend target: $COCKPIT_BACKEND_URL"
          echo "cockpit selector: $COCKPIT_SELECTOR (stall freeze/resume ms: '${PETAL_COCKPIT_STALL_FREEZE_MS}'/'${PETAL_COCKPIT_STALL_RESUME_MS}')"
          set +e
          # PETAL_BACKEND_URL is read at RUNTIME first (transport/token.rs);
          # an EMPTY value means "no backend" (the loopback tier's setting), so
          # the Cockpit needs the real one here.
          # Likewise the loopback tier's PETAL_AUTOTEST_* vars: they would start
          # the autotest join hook inside the Cockpit process and override its
          # generated identity with "native-autotest", which prod's token
          # endpoint rejects (400: not a generated participant id).
          # The QA binary MUST come from build-cockpit-primary.sh (COCKPIT_RUNBOOK
          # "Build requirements"): it stamps the generated test-pattern asset
          # provenance the engine verifies, and enforces the #315 Swift runtime
          # policy. cockpit.mjs's bare `cargo run` produced a binary whose
          # SHARE-N2W-Q / DRAW-N / TELE all reported INFRA-FAIL on provenance.
          env -u LIVEKIT_URL -u LIVEKIT_API_KEY -u LIVEKIT_API_SECRET \
              -u PETAL_AUTOTEST_ROOM -u PETAL_AUTOTEST_IDENTITY -u PETAL_AUTOTEST_NAME \
              -u PETAL_AUTOTEST_FRESH_ROOM -u PETAL_ACCESSORY_UI -u RUSTFLAGS \
            bash apps/desktop/scripts/build-cockpit-primary.sh
          build_exit=$?
          if [ "$build_exit" -ne 0 ]; then echo "::error::build-cockpit-primary.sh failed ($build_exit)"; exit "$build_exit"; fi
          # The engine names its results dir by its start time in ms; anything
          # older than this is a previous run's and must not be scored.
          COCKPIT_STARTED_MS=$(( $(date +%s) * 1000 ))
          # PETAL_WEB_HARNESS_URL_MATCH is unset here for the same reason as
          # LIVEKIT_*: the job-level value (localhost:5185) belongs to the
          # loopback tier, and it would make the cockpit-drive CDP lookup hunt
          # for a tab that does not exist in this tier. Unset, the engine
          # derives the needle from PETAL_HARNESS_URL's host, which is right
          # for both a production and a staged target.
          env -u LIVEKIT_URL -u LIVEKIT_API_KEY -u LIVEKIT_API_SECRET \
              -u PETAL_AUTOTEST_ROOM -u PETAL_AUTOTEST_IDENTITY -u PETAL_AUTOTEST_NAME \
              -u PETAL_AUTOTEST_FRESH_ROOM -u PETAL_ACCESSORY_UI \
              -u PETAL_WEB_HARNESS_URL_MATCH \
            PETAL_BACKEND_URL="$COCKPIT_BACKEND_URL" PETAL_HARNESS_URL="$COCKPIT_HARNESS_URL" \
            PETAL_DISABLE_AUDIO=1 RUST_LOG=info \
            apps/desktop/src-tauri/target/debug/desktop --test-case="$COCKPIT_SELECTOR"
          engine_exit=$?
          set -e
          # run.jsonl carries the verdicts; the engine exit is scored too (a
          # crash/kill after the verdicts were written shows only there).
          touch "$CONSENT_STOP" 2>/dev/null || true
          kill "$CONSENT_PID" 2>/dev/null || true
          if [ -s "$CONSENT_LOG" ]; then
            if grep -q "CLICKED\[" "$CONSENT_LOG"; then
              echo "::warning::A screen-capture consent alert appeared during the cockpit run and was answered (#234). Captures before the click may be occluded."
            fi
            mkdir -p "$RUNNER_TEMP/petal-cockpit"
            cp "$CONSENT_LOG" "$RUNNER_TEMP/petal-cockpit/" 2>/dev/null || true
          fi
          RUN_DIR="$(ls -dt "$HOME/Library/Logs/Petal/test-runs/"*/ 2>/dev/null | head -1)"
          echo "cockpit results dir: ${RUN_DIR:-<none>} (engine exit $engine_exit)"
          mkdir -p "$RUNNER_TEMP/petal-cockpit"
          [ -n "$RUN_DIR" ] && cp -R "$RUN_DIR" "$RUNNER_TEMP/petal-cockpit/" || true
          # A crash on a background thread can leave the verdict lines intact
          # and the engine exit clean; the crash reporter does not lie. Any new
          # desktop*.ips since this step began fails the gate outright.
          NEW_CRASHES="$(find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'desktop*.ips' -newer "$CRASH_MARK" 2>/dev/null || true)"
          if [ -n "$NEW_CRASHES" ]; then
            echo "::error::Petal wrote crash report(s) during the Test Cockpit run:"; echo "$NEW_CRASHES"
            mkdir -p "$RUNNER_TEMP/petal-cockpit/crashes"
            while IFS= read -r f; do [ -n "$f" ] && cp "$f" "$RUNNER_TEMP/petal-cockpit/crashes/" 2>/dev/null || true; done <<< "$NEW_CRASHES"
            exit 1
          fi
          # Verdict: fresh run dir (not a previous run's), every started
          # scenario reached a verdict, every non-pass is quarantined, and the
          # engine finished (cleanup verified + a complete, uncancelled
          # conclusion with one verdict per listed scenario), and the engine
          # exit is 0 or explained by a quarantined failure.
          node "$VERDICT" cockpit --run-dir "${RUN_DIR:-}" --started-at-ms "$COCKPIT_STARTED_MS" \
            --selector "$COCKPIT_SELECTOR" --engine-exit "$engine_exit" --quarantine "$E2E_QUARANTINE_COCKPIT"

      # The two tiers below are independent: a Cockpit failure must not hide
      # the loopback suite's verdict (or vice versa). The job still fails.
      - name: Install web-harness deps
        if: ${{ !cancelled() }}
        working-directory: web-harness
        run: npm ci

      # #150: the phase handoff, made explicit. The Cockpit tier and the
      # loopback tier each run their own Petal, and it is the SAME
      # single-instance app: while the first is still tearing down, a second
      # launch has its argv forwarded to it by `tauri-plugin-single-instance`
      # and exits, after which the loopback below spends its whole socket
      # budget waiting for a socket nobody will ever open. Waiting here turns
      # that into a bounded, named failure BEFORE the tier that would report it
      # as an unexplained 600s timeout.
      #
      # The wait is BY PID (`ps -p`), never by re-running a `pgrep -f` pattern
      # in a loop: `pgrep -f` matches the watcher's own command line, so it is
      # wrong in BOTH directions -- it has reported a finished job as running
      # and a killed process as still alive (CLAUDE.md rule 5). A pattern is
      # used once, to discover candidates; every decision after that is by pid.
      #
      # It waits, it does not kill: "refuse, don't kill" (#846). Nothing here
      # clears the way for the next phase -- if an instance will not exit, the
      # gate says so and stops.
      - name: Wait for the Cockpit's Petal to exit (phase handoff)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PETAL_PHASE_HANDOFF_TIMEOUT_S: "300"
        run: |
          set -euo pipefail
          GUARD_PHASE="Cockpit -> loopback handoff"
          GUARD_REQUIRED_FNS="petal_guard_wait_for_instances_exit petal_guard_live_instances petal_guard_pid_alive"
          # >>> petal-guard availability assertion (#150) >>>
          # A check that cannot tell "I looked and found a problem" from "I could
          # not look" is the exact failure this gate exists to prevent, so prove
          # the helpers are HERE before trusting any exit status from them.
          #
          # WHY THEY CAN LEGITIMATELY BE ABSENT: `workflow_dispatch` runs the
          # workflow definition from the DEFAULT BRANCH but checks out the ref you
          # name. Dispatching an older tag therefore pairs this current step with a
          # tree whose scripts/petal-instance-guard.sh predates these helpers --
          # a legitimate way to run this workflow. Bash then returns 127 ("command
          # not found"), `if ! helper ...` reads that identically to "the check ran
          # and found trouble", and the step reports a cause it never observed:
          # run 34475294637 printed a detailed lingering-instance message and "pids
          # named above" having never looked, with no pids above.
          #
          # INLINE rather than a shared script, on purpose: the workflow always
          # comes from the default branch, while anything under scripts/ is
          # precisely what may be missing.
          GUARD_SH="scripts/petal-instance-guard.sh"
          GUARD_MISSING=""
          if [ ! -f "$GUARD_SH" ]; then
            GUARD_MISSING=" $GUARD_SH (the file itself)"
          else
            # shellcheck source=scripts/petal-instance-guard.sh
            source "$GUARD_SH"
            for fn in $GUARD_REQUIRED_FNS; do
              declare -F "$fn" >/dev/null 2>&1 || GUARD_MISSING="$GUARD_MISSING $fn"
            done
          fi
          if [ -n "$GUARD_MISSING" ]; then
            echo "::error::${GUARD_PHASE}: CANNOT CHECK -- the petal-guard helpers this step relies on are not in this checkout (missing:${GUARD_MISSING}). NO instance check was performed, so this is NOT a report that a Petal instance is lingering -- nothing was observed either way. Most likely cause: workflow_dispatch runs the workflow definition from the default branch but checks out the ref you named, so an older tag pairs a current workflow with an older tree (#150). Re-dispatch a ref whose scripts/petal-instance-guard.sh defines these helpers."
            exit 1
          fi
          # <<< petal-guard availability assertion (#150) <<<

          # The wait's OWN output is the only source of pids this step may claim to
          # have seen. Capture it, print it, and name pids in the error only when
          # the wait actually named some: the previous wording said "pids named
          # above" unconditionally, which was a fabrication on any path where the
          # wait had not really run (#150).
          # `tee`, not a captured substitution, so a long wait still streams into the
          # job log instead of appearing all at once when it finishes.
          HANDOFF_LOG="$(mktemp -t petal-handoff-wait)"
          set +e
          petal_guard_wait_for_instances_exit "$PETAL_PHASE_HANDOFF_TIMEOUT_S" 2>&1 | tee "$HANDOFF_LOG"
          HANDOFF_RC=${PIPESTATUS[0]}
          set -e
          if [ "$HANDOFF_RC" -ne 0 ]; then
            STUCK_PIDS="$(sed -n 's/.*(pid \([0-9][0-9]*\)) had not exited.*/\1/p' "$HANDOFF_LOG" | tr '\n' ' ')"
            STUCK_PIDS="${STUCK_PIDS% }"
            if [ -n "${STUCK_PIDS// /}" ]; then
              echo "::error::Cockpit -> loopback handoff: a Petal instance was STILL running ${PETAL_PHASE_HANDOFF_TIMEOUT_S}s after the Test Cockpit tier finished (pid(s): ${STUCK_PIDS}). The loopback tier cannot start its own instance while that one holds the single-instance lock, so the gate stops here rather than reporting it later as an unexplained socket timeout."
            else
              echo "::error::Cockpit -> loopback handoff: the by-pid instance wait exited ${HANDOFF_RC} WITHOUT naming a lingering pid, so it is NOT established that anything is still running. Read the wait's own output above; do not assume a stuck instance."
            fi
            exit 1
          fi

      - name: Run live loopback harness
        if: ${{ !cancelled() }}
        shell: bash
        # #102: the step-level half of the bound. The job cap above frees the
        # runner; this one fails the STEP that wedged, so the failure names
        # itself instead of arriving as an opaque cancelled job. The harness's
        # own PETAL_HARNESS_RUN_TIMEOUT_MS (15m) should fire first and capture
        # a backtrace; this is the backstop for a wedge outside the harness.
        timeout-minutes: 25
        env:
          # Land wedge evidence (a `sample` backtrace of the desktop process
          # plus the tail of the app log) in the directory this job uploads.
          PETAL_WEDGE_EVIDENCE_DIR: ${{ runner.temp }}/petal-nightly-loopback
          PETAL_DEV_LOG: ${{ runner.temp }}/petal-nightly-loopback/petal-dev.log
          RC_TEST_REPLAY_DELAY_MS: ${{ inputs.rc_test_replay_delay_ms || '' }}
          # #377: the usage-stats opt-out check serves a mock PostHog ingest on
          # this port; Petal gets a throwaway key pointed at it (launch only).
          PETAL_POSTHOG_CONSENT_PORT: "18977"
          NET_DELAY_MS_OVERRIDE: ${{ inputs.net_delay_ms || '' }}
          NET_LOSS_PCT_OVERRIDE: ${{ inputs.net_loss_pct || '' }}
          PETAL_RC_FREEZE_PROBE_RED_PAUSE_MS: ${{ inputs.freeze_probe_red_pause_ms || '' }}
        run: |
          set -euo pipefail

          # #150: petal_guard_* -- the by-pid instance helpers. Sourced here so
          # a socket that never appears can name WHICH failure it is instead of
          # reporting the same "did not open $SOCKET" for a crash, a launch
          # that never happened, and a single-instance lock held by another
          # Petal.
          #
          # The availability assertion below is byte-identical to the phase-handoff
          # step's, and this step needs it just as badly: without the helpers,
          # `PRE_LAUNCH_INSTANCES="$(petal_guard_live_instances | ...)"` comes back
          # EMPTY (the pipeline's status is tr's, so `set -e` never fires) and the
          # step silently concludes "nothing was running" without looking, while
          # `! petal_guard_pid_alive "$LAUNCHER_PID"` is true for every pid and can
          # break the socket wait early reporting "the launcher is gone". Both are
          # the same fabrication the handoff step made in run 34475294637. Stop
          # here instead, naming the missing helper.
          GUARD_PHASE="loopback tier"
          GUARD_REQUIRED_FNS="petal_guard_live_instances petal_guard_pid_alive petal_guard_diagnose_missing_socket"
          # >>> petal-guard availability assertion (#150) >>>
          # A check that cannot tell "I looked and found a problem" from "I could
          # not look" is the exact failure this gate exists to prevent, so prove
          # the helpers are HERE before trusting any exit status from them.
          #
          # WHY THEY CAN LEGITIMATELY BE ABSENT: `workflow_dispatch` runs the
          # workflow definition from the DEFAULT BRANCH but checks out the ref you
          # name. Dispatching an older tag therefore pairs this current step with a
          # tree whose scripts/petal-instance-guard.sh predates these helpers --
          # a legitimate way to run this workflow. Bash then returns 127 ("command
          # not found"), `if ! helper ...` reads that identically to "the check ran
          # and found trouble", and the step reports a cause it never observed:
          # run 34475294637 printed a detailed lingering-instance message and "pids
          # named above" having never looked, with no pids above.
          #
          # INLINE rather than a shared script, on purpose: the workflow always
          # comes from the default branch, while anything under scripts/ is
          # precisely what may be missing.
          GUARD_SH="scripts/petal-instance-guard.sh"
          GUARD_MISSING=""
          if [ ! -f "$GUARD_SH" ]; then
            GUARD_MISSING=" $GUARD_SH (the file itself)"
          else
            # shellcheck source=scripts/petal-instance-guard.sh
            source "$GUARD_SH"
            for fn in $GUARD_REQUIRED_FNS; do
              declare -F "$fn" >/dev/null 2>&1 || GUARD_MISSING="$GUARD_MISSING $fn"
            done
          fi
          if [ -n "$GUARD_MISSING" ]; then
            echo "::error::${GUARD_PHASE}: CANNOT CHECK -- the petal-guard helpers this step relies on are not in this checkout (missing:${GUARD_MISSING}). NO instance check was performed, so this is NOT a report that a Petal instance is lingering -- nothing was observed either way. Most likely cause: workflow_dispatch runs the workflow definition from the default branch but checks out the ref you named, so an older tag pairs a current workflow with an older tree (#150). Re-dispatch a ref whose scripts/petal-instance-guard.sh defines these helpers."
            exit 1
          fi
          # <<< petal-guard availability assertion (#150) <<<

          LOG_DIR="$RUNNER_TEMP/petal-nightly-loopback"
          mkdir -p "$LOG_DIR"
          SOCKET="$LOG_DIR/petal-rc.sock"
          RESULTS_JSON="$LOG_DIR/remote-control-results.json"
          PHOTON_JSON="$LOG_DIR/remote-control-photon.json"
          LATENCY_JSON="$LOG_DIR/remote-control-latency.json"
          IMPAIRED_RESULTS_JSON="$LOG_DIR/remote-control-results-impaired.json"
          IMPAIRED_PHOTON_JSON="$LOG_DIR/remote-control-photon-impaired.json"
          IMPAIRED_LATENCY_JSON="$LOG_DIR/remote-control-latency-impaired.json"
          CLEAN_PETAL_LOG="$LOG_DIR/petal-dev-clean.log"
          IMPAIRED_PETAL_LOG="$LOG_DIR/petal-dev-impaired.log"
          NET_DELAY_MS="${NET_DELAY_MS_OVERRIDE:-$PETAL_NET_IMPAIR_DELAY_MS}"
          NET_LOSS_PCT="${NET_LOSS_PCT_OVERRIDE:-$PETAL_NET_IMPAIR_LOSS_PCT}"
          HARNESS_LOG="$LOG_DIR/remote-control-live.log"
          LIVEKIT_LOG="$LOG_DIR/livekit.log"
          WEB_LOG="$LOG_DIR/web-harness.log"
          CHROME_LOG="$LOG_DIR/chrome-cdp.log"
          PETAL_LOG="$LOG_DIR/petal-dev.log"
          rm -f "$SOCKET" "$RESULTS_JSON" "$PHOTON_JSON" "$LATENCY_JSON" \
            "$IMPAIRED_RESULTS_JSON" "$IMPAIRED_PHOTON_JSON" "$IMPAIRED_LATENCY_JSON"
          CRASH_MARK="$LOG_DIR/loopback-start.mark"; touch "$CRASH_MARK"

          pids=()
          IMPAIR_ON=0
          cleanup() {
            # #378: never leave dummynet on the runner (the always() step
            # below checks again and fails the job if anything survived).
            if [ "$IMPAIR_ON" = 1 ]; then bash scripts/ci/net-impair.sh off || true; fi
            for pid in "${pids[@]:-}"; do
              if kill -0 "$pid" >/dev/null 2>&1; then
                kill "$pid" >/dev/null 2>&1 || true
              fi
            done
          }
          trap cleanup EXIT

          echo "==> Preflight runner tools" | tee "$HARNESS_LOG"
          command -v livekit-server | tee -a "$HARNESS_LOG"
          test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"

          echo "==> Start local LiveKit" | tee -a "$HARNESS_LOG"
          if ! lsof -iTCP:7880 -sTCP:LISTEN >/dev/null 2>&1; then
            livekit-server --dev >"$LIVEKIT_LOG" 2>&1 &
            pids+=("$!")
            sleep 2
          fi

          echo "==> Start web-harness on :5185" | tee -a "$HARNESS_LOG"
          if ! lsof -iTCP:5185 -sTCP:LISTEN >/dev/null 2>&1; then
            (
              cd web-harness
              PETAL_BACKEND_URL= npm exec vite -- --port 5185 --strictPort
            ) >"$WEB_LOG" 2>&1 &
            pids+=("$!")
            sleep 4
          fi

          echo "==> Start Chrome with CDP on :9222" | tee -a "$HARNESS_LOG"
          if ! lsof -iTCP:9222 -sTCP:LISTEN >/dev/null 2>&1; then
            rm -rf "$LOG_DIR/chrome-profile"
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
              --remote-debugging-port=9222 \
              --user-data-dir="$LOG_DIR/chrome-profile" \
              --no-first-run \
              --no-default-browser-check \
              --disable-backgrounding-occluded-windows \
              --disable-background-timer-throttling \
              --disable-renderer-backgrounding \
              "http://localhost:5185/" >"$CHROME_LOG" 2>&1 &
            pids+=("$!")
            sleep 5
          fi

          echo "==> Start Petal dev with autotest socket" | tee -a "$HARNESS_LOG"
          # #150: snapshot every Petal that is alive BEFORE we launch our own.
          # Discovery by pattern happens exactly once, here; from now on each
          # of these is judged by its pid. A survivor from this list is the one
          # thing that can hold the single-instance lock against us, and that
          # is what the timeout below reports instead of guessing.
          PRE_LAUNCH_INSTANCES="$(petal_guard_live_instances | tr '\n' ' ')"
          if [ -n "${PRE_LAUNCH_INSTANCES// /}" ]; then
            echo "::warning::A Petal instance was already running when the loopback tier launched its own: $PRE_LAUNCH_INSTANCES -- the phase handoff did not settle." | tee -a "$HARNESS_LOG"
          fi
          # Red-proof dispatches only (input rc_test_replay_delay_ms); empty
          # on every release run, and the debug-only knob ignores empty.
          if [ -n "$RC_TEST_REPLAY_DELAY_MS" ]; then
            case "$RC_TEST_REPLAY_DELAY_MS" in
              *[!0-9]*) echo "::error::rc_test_replay_delay_ms must be an integer"; exit 1 ;;
            esac
            echo "::warning::RED-PROOF RUN: host replay stalled ${RC_TEST_REPLAY_DELAY_MS}ms; the latency gate is expected to FAIL." | tee -a "$HARNESS_LOG"
          fi
          (
            cd apps/desktop
            PETAL_BACKEND_URL= \
            PETAL_AUTOTEST_SOCK="$SOCKET" \
            PETAL_RC_TEST_REPLAY_DELAY_MS="$RC_TEST_REPLAY_DELAY_MS" \
            PETAL_POSTHOG_KEY=phc_loopback_consent_probe \
            PETAL_POSTHOG_HOST="http://127.0.0.1:${PETAL_POSTHOG_CONSENT_PORT}" \
            npm run dev:clean
          ) >"$PETAL_LOG" 2>&1 &
          # The launcher's own pid (this subshell, which runs `npm run
          # dev:clean` and stays alive for as long as the app it started). Its
          # death is one of the causes the diagnosis below distinguishes.
          LAUNCHER_PID=$!
          pids+=("$LAUNCHER_PID")

          echo "==> Wait for native join and autotest socket" | tee -a "$HARNESS_LOG"
          joined=""
          # Overridable ONLY so the contract test in
          # scripts/test-e2e-gate-handoff.sh can drive this exact loop -- the
          # real wiring, not a copy of it -- in seconds instead of ten minutes.
          # CI never sets it; the gate's budget is the 600 default.
          SOCKET_BUDGET_S="${PETAL_SOCKET_BUDGET_S:-600}"
          # `npm run dev:clean` may rebuild the Rust app first (minutes on a
          # fresh runner), so the budget is generous; a real join failure or
          # an ownership refusal still fails within a second of appearing.
          # Readiness is the autotest socket, as in scripts/rc-live-suite.sh --
          # with FRESH_ROOM the joined room is not literally named 'rctest'.
          waited=0
          while [ "$waited" -lt "$SOCKET_BUDGET_S" ]; do
            if grep -qE "join_room\('[^']*'\) failed|autotest room ownership rejected" "$PETAL_LOG" 2>/dev/null; then
              echo "::error::Native join failed; see petal-dev.log artifact." | tee -a "$HARNESS_LOG"
              grep -E "join_room\('[^']*'\) failed|autotest room ownership rejected" "$PETAL_LOG" | tee -a "$HARNESS_LOG"
              exit 1
            fi
            if [ -S "$SOCKET" ]; then
              joined=1
              sleep 2
              break
            fi
            # #150: don't spend the whole budget on an outcome that is already
            # decided. Every 15s, if the launcher is gone AND no Petal process
            # exists at all, no socket is coming -- stop and diagnose. This
            # only ever fails FASTER; it can never turn a failure into a pass.
            if [ $((waited % 15)) -eq 14 ] \
               && ! petal_guard_pid_alive "$LAUNCHER_PID" \
               && [ -z "$(petal_guard_live_instances | tr -d '[:space:]')" ]; then
              echo "petal-guard: the launcher is gone and no Petal process is running after ${waited}s -- not waiting out the rest of the ${SOCKET_BUDGET_S}s budget." | tee -a "$HARNESS_LOG"
              break
            fi
            sleep 1
            waited=$((waited + 1))
          done
          if [ -z "$joined" ]; then
            # #150: "did not open $SOCKET" is the same sentence for four
            # different failures (a crash, a launch that never happened, a
            # single-instance lock held by another Petal, and an app that is up
            # but not answering). Name which one, in the log, at the moment it
            # is still knowable -- an artifact download a day later cannot
            # recover it.
            set +e
            DIAGNOSIS="$(petal_guard_diagnose_missing_socket \
              "$SOCKET" "$LAUNCHER_PID" "$HOME/Library/Logs/DiagnosticReports" "$CRASH_MARK" \
              $PRE_LAUNCH_INSTANCES 2>&1)"
            set -e
            printf '%s\n' "$DIAGNOSIS" | tee -a "$HARNESS_LOG"
            # A crash on this path is evidence too, and the post-suite crash
            # collection below never runs when we exit here -- so collect it
            # into the directory the artifact upload covers (#150).
            mkdir -p "$LOG_DIR/crashes"
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'desktop*.ips' \
              -newer "$CRASH_MARK" -exec cp {} "$LOG_DIR/crashes/" \; 2>/dev/null || true
            SOCKET_CAUSE="$(printf '%s\n' "$DIAGNOSIS" | sed -n 's/^petal-guard: cause=//p' | head -1)"
            echo "::error::Petal did not open $SOCKET within ${waited}s (budget ${SOCKET_BUDGET_S}s) -- cause: ${SOCKET_CAUSE:-undiagnosed}. Diagnosis above; see the petal-dev.log artifact." | tee -a "$HARNESS_LOG"
            exit 1
          fi

          echo "==> Run live remote-control local loopback" | tee -a "$HARNESS_LOG"
          set +e
          # PETAL_LOG_PATH: the display cases (37-41) read the host's replay
          # lines from THIS log; ~/Library/Logs/Petal/petal.log never gets them
          # on the runner, and the cases refuse to pass on a blind log.
          PETAL_AUTOTEST_SOCK="$SOCKET" PETAL_LOG_PATH="$PETAL_LOG" \
            node apps/desktop/scripts/remote-control-local-loopback.mjs --live --json "$RESULTS_JSON" \
            2>&1 | tee -a "$HARNESS_LOG"
          status=${PIPESTATUS[0]}
          set -e

          # Press-to-photon: web input -> sentinel repaint -> decoded frame back
          # in the controller's browser, i.e. the round trip a pair-programming
          # controller feels. Same Petal instance, so the survival/crash checks
          # below cover it too. Its verdict is the latency gate's, further down:
          # an incomplete or skipped photon run is INSUFFICIENT there, not a pass.
          echo "==> Run press-to-photon (latency gate)" | tee -a "$HARNESS_LOG"
          set +e
          PETAL_AUTOTEST_SOCK="$SOCKET" PETAL_LOG_PATH="$PETAL_LOG" \
            node apps/desktop/scripts/remote-control-local-loopback.mjs --live --skip-preflight --press-to-photon --json "$PHOTON_JSON" \
            2>&1 | tee -a "$HARNESS_LOG"
          photon_status=${PIPESTATUS[0]}
          set -e
          echo "press-to-photon harness exit $photon_status (verdict: latency gate below)" | tee -a "$HARNESS_LOG"

          # #377: with usage stats OFF, 30s of share churn must produce zero
          # PostHog POSTs; the script proves the pipe is live first (ON) and
          # that sending resumes after (ON again), so a 0 is never vacuous.
          echo "==> PostHog usage-stats opt-out (#377)" | tee -a "$HARNESS_LOG"
          set +e
          PETAL_AUTOTEST_SOCK="$SOCKET" \
            node apps/desktop/scripts/posthog-consent-live.mjs --port "$PETAL_POSTHOG_CONSENT_PORT" \
            --off-seconds 30 --json "$LOG_DIR/posthog-consent.json" 2>&1 | tee -a "$HARNESS_LOG"
          consent_status=${PIPESTATUS[0]}
          set -e

          gate_fail=0

          # -- #378 IMPAIRED PASS: the same two suites, same Petal, with
          # dummynet on the LiveKit ports only. Each tier's host log slice is
          # cut by byte offset so the two latency verdicts never mix events.
          CLEAN_LOG_BYTES="$(wc -c < "$PETAL_LOG" | tr -d ' ')"
          head -c "$CLEAN_LOG_BYTES" "$PETAL_LOG" > "$CLEAN_PETAL_LOG"
          if [ -n "$NET_DELAY_MS_OVERRIDE$NET_LOSS_PCT_OVERRIDE" ]; then
            echo "::warning::RED-PROOF RUN: impaired pass at ${NET_DELAY_MS}ms/${NET_LOSS_PCT}% instead of the gate profile ${PETAL_NET_IMPAIR_DELAY_MS}ms/${PETAL_NET_IMPAIR_LOSS_PCT}%; impaired network budgets are expected to FAIL." | tee -a "$HARNESS_LOG"
          fi
          echo "==> Impaired pass (#378): ${NET_DELAY_MS}ms each way per SFU traversal, ${NET_LOSS_PCT}% loss each way" | tee -a "$HARNESS_LOG"
          set +e
          IMPAIR_ON=1
          bash scripts/ci/net-impair.sh on "$NET_DELAY_MS" "$NET_LOSS_PCT" 2>&1 | tee -a "$HARNESS_LOG"
          impair_on_status=${PIPESTATUS[0]}
          set -e
          impaired_status=""
          impaired_photon_status=""
          if [ "$impair_on_status" -ne 0 ]; then
            if [ "$E2E_IMPAIRED_BLOCKING" = "true" ]; then
              echo "::error::Could not apply the network impairment ($impair_on_status); the impaired pass did not run, so the gate cannot pass." | tee -a "$HARNESS_LOG"
              gate_fail=1
            else
              echo "::warning::REPORT-ONLY: would fail -- could not apply the network impairment ($impair_on_status); the impaired pass did not run." | tee -a "$HARNESS_LOG"
            fi
          else
            set +e
            PETAL_AUTOTEST_SOCK="$SOCKET" PETAL_LOG_PATH="$PETAL_LOG" \
            PETAL_RC_OBSERVATION_BUDGET_MS="$IMPAIRED_OBSERVATION_BUDGET_MS" PETAL_RC_RECONNECT_ALREADY_USED=1 \
              node apps/desktop/scripts/remote-control-local-loopback.mjs --live --skip-preflight --json "$IMPAIRED_RESULTS_JSON" \
              2>&1 | tee -a "$HARNESS_LOG"
            impaired_status=${PIPESTATUS[0]}
            PETAL_AUTOTEST_SOCK="$SOCKET" PETAL_LOG_PATH="$PETAL_LOG" \
              node apps/desktop/scripts/remote-control-local-loopback.mjs --live --skip-preflight --press-to-photon --json "$IMPAIRED_PHOTON_JSON" \
              2>&1 | tee -a "$HARNESS_LOG"
            impaired_photon_status=${PIPESTATUS[0]}
            set -e
            echo "impaired pass: matrix exit $impaired_status, press-to-photon exit $impaired_photon_status" | tee -a "$HARNESS_LOG"
          fi
          set +e
          bash scripts/ci/net-impair.sh off 2>&1 | tee -a "$HARNESS_LOG"
          impair_off_status=${PIPESTATUS[0]}
          set -e
          if [ "$impair_off_status" -eq 0 ]; then IMPAIR_ON=0; else
            if [ "$E2E_IMPAIRED_BLOCKING" = "true" ]; then
              echo "::error::Network impairment teardown failed ($impair_off_status)." | tee -a "$HARNESS_LOG"
              gate_fail=1
            else
              echo "::warning::REPORT-ONLY: would fail -- network impairment teardown failed ($impair_off_status); the always() teardown step re-checks it." | tee -a "$HARNESS_LOG"
            fi
          fi
          tail -c +"$((CLEAN_LOG_BYTES + 1))" "$PETAL_LOG" > "$IMPAIRED_PETAL_LOG"

          # -- Survival. The 0.9.7 telepointer SIGSEGV lived on a background
          # thread the harness never talks to; a green scorecard alone would
          # not have caught it. The native app must still be alive after the
          # whole matrix, and the crash reporter must have nothing new.
          echo "==> Post-suite: process survival + crash reports" | tee -a "$HARNESS_LOG"
          if ! pgrep -x desktop >/dev/null 2>&1; then
            echo "::error::Petal (desktop) is no longer running after the loopback matrix." | tee -a "$HARNESS_LOG"
            gate_fail=1
          fi
          # #154: the harness's own photon-sentinel window vanished mid-run on
          # one release gate and nothing recorded why. These reports are
          # DIAGNOSTIC ONLY -- a dead fixture already fails the run through the
          # harness; this just puts the reason in the artifact.
          SENTINEL_CRASHES="$(find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'PetalRCPhotonSentinel*.ips' -newer "$CRASH_MARK" 2>/dev/null || true)"
          if [ -n "$SENTINEL_CRASHES" ]; then
            echo "note: the photon sentinel wrote crash report(s) during this run (harness fixture, not Petal):" | tee -a "$HARNESS_LOG"
            echo "$SENTINEL_CRASHES" | tee -a "$HARNESS_LOG"
            mkdir -p "$LOG_DIR/crashes"
            while IFS= read -r f; do [ -n "$f" ] && cp "$f" "$LOG_DIR/crashes/" 2>/dev/null || true; done <<< "$SENTINEL_CRASHES"
          fi
          NEW_CRASHES="$(find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -name 'desktop*.ips' -newer "$CRASH_MARK" 2>/dev/null || true)"
          if [ -n "$NEW_CRASHES" ]; then
            echo "::error::Petal wrote crash report(s) during the loopback run:" | tee -a "$HARNESS_LOG"
            echo "$NEW_CRASHES" | tee -a "$HARNESS_LOG"
            mkdir -p "$LOG_DIR/crashes"
            while IFS= read -r f; do [ -n "$f" ] && cp "$f" "$LOG_DIR/crashes/" 2>/dev/null || true; done <<< "$NEW_CRASHES"
            gate_fail=1
          fi

          # -- SLS hit-test evidence. While a share is up the telepointer
          # sender hit-tests the cursor through SkyLight at 45 Hz. 0.9.7's
          # wrong FFI declaration made that a miss on EVERY call for a whole
          # release, silently. platform/sls.rs now logs a one-shot verdict;
          # the gate requires LIVE and rejects all-MISS.
          echo "==> Post-suite: SLS hit-test evidence" | tee -a "$HARNESS_LOG"
          if grep -q "SLS hit-test answered MISS on all" "$PETAL_LOG"; then
            echo "::error::SLS hit-test never returned a window during the run (petal-dev.log) -- the 0.9.7 regression class." | tee -a "$HARNESS_LOG"
            gate_fail=1
          elif ! grep -q "SLS hit-test LIVE" "$PETAL_LOG"; then
            echo "::error::No 'SLS hit-test LIVE' line in petal-dev.log -- no share ran long enough, or the hit-test is silent." | tee -a "$HARNESS_LOG"
            gate_fail=1
          else
            grep -m1 "SLS hit-test LIVE" "$PETAL_LOG" | tee -a "$HARNESS_LOG"
          fi

          # -- Scorecard with quarantine (scripts/ci/e2e-gate-verdict.mjs,
          # unit-tested both directions). Fails on: a missing/empty/inconsistent
          # scorecard, zero passes, any unquarantined fail, any skip not on the
          # script's evidence-backed EXPECTED_LOOPBACK_SKIPS allow-list (cases
          # 23 and 30 on this single-display macOS runner) or the quarantine
          # list, summary.tokenlessDrops > 0 (#580), and a non-zero harness exit
          # that no quarantined failure explains, and any --required case that
          # did not pass (missing, skipped or failed). Never a pass by absence.
          echo "==> Post-suite: scorecard" | tee -a "$HARNESS_LOG"
          VERDICT="scripts/ci/e2e-gate-verdict.mjs"
          if [ ! -f "$VERDICT" ]; then
            echo "::error::CANNOT CHECK: $VERDICT is not in this checkout; no loopback verdict was computed." | tee -a "$HARNESS_LOG"
            gate_fail=1
          else
            set +e
            node "$VERDICT" loopback --results "$RESULTS_JSON" --harness-exit "$status" \
              --quarantine "$E2E_QUARANTINE_RC_CASES" --required "$E2E_REQUIRED_RC_CASES" 2>&1 | tee -a "$HARNESS_LOG"
            scorecard_status=${PIPESTATUS[0]}
            set -e
            [ "$scorecard_status" -eq 0 ] || gate_fail=1

            # -- Run-level remote-control latency budgets (`latency` tier of
            # the same verdict script; budgets + calibration in env above).
            echo "==> Post-suite: remote-control latency gate" | tee -a "$HARNESS_LOG"
            set +e
            node "$VERDICT" latency --results "$RESULTS_JSON" --photon "$PHOTON_JSON" \
              --host-log "$CLEAN_PETAL_LOG" --json "$LATENCY_JSON" 2>&1 | tee -a "$HARNESS_LOG"
            latency_status=${PIPESTATUS[0]}
            set -e
            [ "$latency_status" -eq 0 ] || gate_fail=1

            # -- #378 impaired pass: same scorecard rules, impaired budgets
            # for the network-inclusive stages, and stage attribution.
            if [ -n "$impaired_status" ]; then
              echo "==> Post-suite: IMPAIRED scorecard (${NET_DELAY_MS}ms/${NET_LOSS_PCT}%)" | tee -a "$HARNESS_LOG"
              set +e
              node "$VERDICT" loopback --pass impaired --results "$IMPAIRED_RESULTS_JSON" --harness-exit "$impaired_status" \
                --quarantine "$E2E_QUARANTINE_RC_CASES" --required "$E2E_REQUIRED_RC_CASES" 2>&1 | tee -a "$HARNESS_LOG"
              [ "${PIPESTATUS[0]}" -eq 0 ] || gate_fail=1
              echo "==> Post-suite: IMPAIRED remote-control latency gate" | tee -a "$HARNESS_LOG"
              PETAL_RC_OBSERVATION_P50_BUDGET_MS="$IMPAIRED_OBSERVATION_P50_MS" \
              PETAL_RC_OBSERVATION_P95_BUDGET_MS="$IMPAIRED_OBSERVATION_P95_MS" \
              PETAL_RC_SEND_TO_INJECT_P95_BUDGET_MS="$IMPAIRED_SEND_TO_INJECT_P95_MS" \
              PETAL_RC_PHOTON_P50_BUDGET_MS="$IMPAIRED_PHOTON_P50_MS" \
              PETAL_REMOTE_CONTROL_PHOTON_P95_BUDGET_MS="$IMPAIRED_PHOTON_P95_MS" \
                node "$VERDICT" latency --pass impaired --results "$IMPAIRED_RESULTS_JSON" --photon "$IMPAIRED_PHOTON_JSON" \
                --host-log "$IMPAIRED_PETAL_LOG" --json "$IMPAIRED_LATENCY_JSON" 2>&1 | tee -a "$HARNESS_LOG"
              [ "${PIPESTATUS[0]}" -eq 0 ] || gate_fail=1
              if [ "$NET_DELAY_MS" -gt 0 ]; then
                echo "==> Post-suite: stage attribution (clean vs impaired)" | tee -a "$HARNESS_LOG"
                node "$VERDICT" attribution --pass impaired --clean "$LATENCY_JSON" --impaired "$IMPAIRED_LATENCY_JSON" \
                  --delay-ms "$NET_DELAY_MS" 2>&1 | tee -a "$HARNESS_LOG"
                [ "${PIPESTATUS[0]}" -eq 0 ] || gate_fail=1
              fi
              set -e
            fi
          fi

          if [ "$consent_status" -ne 0 ]; then
            echo "::error::PostHog usage-stats opt-out check did not pass (exit $consent_status); see posthog-consent.json." | tee -a "$HARNESS_LOG"
            gate_fail=1
          fi

          if [ "$gate_fail" -ne 0 ]; then
            echo "::error::Live e2e gate FAILED (harness exit $status)." | tee -a "$HARNESS_LOG"
            exit 1
          fi
          echo "==> Live e2e gate passed" | tee -a "$HARNESS_LOG"

      # #378: the impairment must never outlive the job. The harness step's
      # trap removes it; this runs even when that step was killed, and FAILS
      # the job if any dummynet rule or pipe is still installed.
      - name: Remove network impairment (always) and verify none remains
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/net-impair.sh ]; then echo "no scripts/ci/net-impair.sh in this checkout; nothing was impaired"; exit 0; fi
          bash scripts/ci/net-impair.sh off || true
          bash scripts/ci/net-impair.sh check-clear

      # #42: Actions masks a secret in the LOG; it does not touch uploaded
      # ARTIFACTS. The bypass secret reaches Chrome's argv (and therefore
      # could reach a crash dump or a verbose browser log), so scrub the whole
      # artifact tree before it leaves the runner. No-op when unset.
      - name: Scrub the deployment-protection bypass secret from artifacts
        if: always()
        env:
          # Must resolve the same way the cockpit step above does, or a
          # dispatched staged run uploads artifacts nothing scrubbed.
          PETAL_VERCEL_BYPASS_SECRET: ${{ secrets.vercel_bypass_secret || secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PETAL_VERCEL_BYPASS_SECRET:-}" ]; then
            echo "no bypass secret in play; nothing to scrub"
            exit 0
          fi
          python3 - "$RUNNER_TEMP/petal-cockpit" "$RUNNER_TEMP/petal-nightly-loopback" <<'PY'
          import os, sys
          needle = os.environ["PETAL_VERCEL_BYPASS_SECRET"].strip().encode()
          if not needle:
              sys.exit(0)
          scrubbed = 0
          for root_dir in sys.argv[1:]:
              for root, _dirs, files in os.walk(root_dir):
                  for name in files:
                      path = os.path.join(root, name)
                      try:
                          data = open(path, "rb").read()
                      except OSError:
                          continue
                      if needle not in data:
                          continue
                      try:
                          open(path, "wb").write(data.replace(needle, b"<redacted>"))
                      except OSError:
                          # Never print the path's contents; the name is enough.
                          print(f"::error::could not scrub {path}")
                          sys.exit(1)
                      scrubbed += 1
          print(f"scrubbed the bypass secret from {scrubbed} artifact file(s)")
          PY

      # #150: the paths are explicit, not a `**` sweep, because this directory
      # also holds Chrome's whole user-data profile -- but every glob here must
      # actually cover the evidence the steps above go to the trouble of
      # collecting. Two did not: the loopback tier's crash reports
      # (`crashes/*.ips`, which the gate DETECTS, prints "Petal wrote crash
      # report(s)" about, and then dropped on the floor) and #102's wedge
      # evidence (`wedge-*-reason.txt`, `wedge-*-sample-<pid>.txt` -- the
      # `sample` backtraces that are the entire point of capturing a wedge).
      # Both were written into this directory and neither was ever uploaded.
      - name: Upload live loopback artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-loopback-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/petal-nightly-loopback/*.log
            ${{ runner.temp }}/petal-nightly-loopback/*.json
            ${{ runner.temp }}/petal-nightly-loopback/*.txt
            ${{ runner.temp }}/petal-nightly-loopback/crashes/**
            ${{ runner.temp }}/petal-cockpit/**
          if-no-files-found: warn
