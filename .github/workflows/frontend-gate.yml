# Frontend verification gate for PRs that can affect the TypeScript/Svelte half
# of the product (issue #75, item 3 of its definition of done).
#
# rust-gate.yml was the only `pull_request` gate that mattered, and its path
# filter covers apps/desktop/src-tauri, contracts and backend only. NOTHING
# gated apps/desktop/src, apps/desktop/tests, web-harness, shared or plugins,
# and three separate breakages sat on `main` unnoticed because of it: two red
# desktop tests (#75) and a web-harness `npm run build` failure that in turn
# masked a second type error behind it (#77). Reviewers on #70/#71/#72 each had
# to stop and re-run against `main` to work out whether a failure was their own
# regression or an existing one -- exactly the condition under which a real
# regression gets waved through as "already broken."
#
# COST: every job here runs on `ubuntu-latest` (1x billing). ci.yml's COST NOTE
# keeps the full CI workflow manual-only because GitHub's macOS runners bill at
# 10x, and that still holds -- this gate deliberately adds NO always-on macOS
# job, and does not use the single self-hosted Tart VM either (it serves the
# release e2e gate; a per-PR job would queue behind releases). What that leaves
# uncovered is written down in docs/TESTING.md, "What the PR gates cover".
#
# #133: this workflow triggers on EVERY pull request and filters internally.
# See rust-gate.yml's header for why the old `paths:` + no-op `paths-ignore`
# companion pair had to go: a mixed PR ran both and two check runs answered to
# one required context name, and the two path lists were kept in step only by a
# comment. One list, here, in the `filter` step.
name: Frontend PR Gate

on:
  pull_request:

concurrency:
  group: frontend-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Frontend path filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      # THE path list for this gate. There is no second copy anywhere.
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          scripts/gate-paths-changed.sh <<'PATHS' >> "$GITHUB_OUTPUT"
          .github/workflows/frontend-gate.yml
          scripts/gate-paths-changed.sh
          scripts/deploy-web-harness.sh
          apps/desktop/src/**
          apps/desktop/tests/**
          apps/desktop/scripts/**
          apps/desktop/static/**
          apps/desktop/package.json
          apps/desktop/package-lock.json
          apps/desktop/svelte.config.js
          apps/desktop/vite.config.js
          apps/desktop/tsconfig.json
          shared/**
          web-harness/**
          plugins/**
          PATHS

  desktop:
    name: Desktop frontend build + tests
    needs: changes
    runs-on: ubuntu-latest
    # Measured ~4min locally for check + build + test; the #724 pattern wants a
    # loud backstop, not a target.
    timeout-minutes: 30
    env:
      RUN: ${{ needs.changes.outputs.frontend }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Not applicable
        if: env.RUN != 'true'
        working-directory: .
        run: echo "No frontend-relevant paths changed in this PR; the desktop frontend gate is not applicable."

      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: actions/setup-node@v7
        if: env.RUN == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - if: env.RUN == 'true'
        run: npm ci

      - if: env.RUN == 'true'
        run: npm run check

      # `npm run build` is REQUIRED BEFORE the tests, not merely alongside them:
      # the rendered tests read generated assets out of build/, and without it
      # ~30 of them fail on missing files -- a harness error that looks exactly
      # like a product regression. Do not reorder these steps.
      - if: env.RUN == 'true'
        run: npm run build

      # The rendered tests drive playwright's chromium-headless-shell over a CDP
      # pipe. `pretest` already runs a plain `playwright install`, but on Linux
      # the browser also needs its shared libraries, which is what `--with-deps`
      # installs. With the browser already present `pretest` is then a no-op.
      # The test helpers resolve `chrome-headless-shell-linux64` out of the
      # playwright cache on their own, so no PETAL_CHROME_BIN is needed.
      - name: Install Chromium headless shell + Linux deps
        if: env.RUN == 'true'
        run: npx playwright install --with-deps chromium-headless-shell

      # This gate runs `npm test`'s stages by hand so it can exclude ONE
      # macOS-only test (below). That means the two can drift, which is how
      # compositor_probe stayed broken for weeks with every gate green (#594,
      # #635). Fail loudly instead: if `npm test` changes, this workflow must
      # change with it.
      - name: Lockstep -- the test steps below must still match `npm test`
        if: env.RUN == 'true'
        run: |
          EXPECTED="node --import tsx --test tests/*.test.ts && node --test scripts/test-remote-control-harness-preflight.mjs scripts/test-remote-control-exit-accounting.mjs scripts/test-remote-control-observation.mjs scripts/test-remote-control-held-input.mjs scripts/test-process-lease-ledger.mjs scripts/test-remote-control-share-readiness.mjs scripts/test-harness-timeouts.mjs && node scripts/check-panel-close.mjs && echo 'panel-close check passed'"
          ACTUAL="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).scripts.test")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::apps/desktop's \`npm test\` script changed; update the steps in .github/workflows/frontend-gate.yml to match, then update this literal."
            echo "expected: $EXPECTED"
            echo "actual:   $ACTUAL"
            exit 1
          fi
          echo "OK: npm test is unchanged; the steps below cover it."

      - name: Frontend suite (tests/*.test.ts)
        if: env.RUN == 'true'
        run: node --import tsx --test tests/*.test.ts

      # `scripts/test-process-lease-ledger.mjs`'s "SIGTERM to the runner tears
      # down its whole spawned group" is the ONE part of `npm test` that is
      # genuinely macOS-only, and it is excluded here by name.
      #
      # Why (measured, not assumed): the ledger decides a leased process is gone
      # by reading `ps -p <pid> -o pgid=,comm=`. A freshly killed child is a
      # zombie until its parent reaps it, and the two platforms report a zombie
      # differently -- macOS `comm` is `<defunct>`, Linux procps still prints
      # the original `sh` with its original pgid. So on macOS the ledger sees
      # the process as gone and logs CLEANED; on Linux it sees a live-looking
      # `sh` and logs ORPHANED / "survived SIGKILL". That is the harness's
      # aliveness oracle, not a product behaviour, and the harness it guards
      # (remote-control-scenario.mjs) only ever runs on macOS.
      #
      # If the test name changes, this filter stops matching and the test RUNS
      # -- i.e. it fails loudly rather than silently going uncovered.
      # macOS coverage of it is unchanged: scripts/ci-local.sh and the
      # self-hosted mac gate still run the whole file.
      - name: Harness script suites (minus the macOS-only lease-ledger case)
        if: env.RUN == 'true'
        run: >
          node --test
          --test-skip-pattern='tears down its whole spawned group'
          scripts/test-remote-control-harness-preflight.mjs
          scripts/test-remote-control-exit-accounting.mjs
          scripts/test-remote-control-observation.mjs
          scripts/test-remote-control-held-input.mjs
          scripts/test-process-lease-ledger.mjs
          scripts/test-remote-control-share-readiness.mjs
          scripts/test-harness-timeouts.mjs

      - name: Panel-close lint
        if: env.RUN == 'true'
        run: node scripts/check-panel-close.mjs

  web-harness:
    name: Web-harness build + tests
    needs: changes
    runs-on: ubuntu-latest
    # The isolated-deploy simulation runs `npm run build` a second time against
    # a staged copy, so this job is roughly twice the work it was.
    timeout-minutes: 25
    env:
      RUN: ${{ needs.changes.outputs.frontend }}
    defaults:
      run:
        working-directory: web-harness
    steps:
      - name: Not applicable
        if: env.RUN != 'true'
        working-directory: .
        run: echo "No frontend-relevant paths changed in this PR; the web-harness gate is not applicable."

      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: actions/setup-node@v7
        if: env.RUN == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-harness/package-lock.json

      - if: env.RUN == 'true'
        run: npm ci

      # `npm run build` here is four gates in one -- `check-package-escapes &&
      # svelte-check && tsc -p tests && vite build` -- and all of them have to
      # run. #77 is why: the vite build was failing, which stopped the chain
      # before a SECOND type error behind it was ever reported.
      - if: env.RUN == 'true'
        run: npm run build

      # #93: the build above runs inside the full checkout, where
      # web-harness/shared's symlink to ../shared resolves either way. It
      # cannot catch "does the ISOLATED deploy build still work" -- the thing
      # that broke silently for days in #662, and again on `main` when a test
      # fixture reached shared/ by a relative path that walks out of the
      # package. `scripts/ci-local.sh` was the ONLY thing running this stage
      # and it runs on nobody's PR. --build-only needs no Vercel CLI, auth or
      # network: it is rsync + npm + the same `npm run build` as above, run
      # against a staged, self-contained copy, so it is portable to
      # ubuntu-latest (rsync is present on the runner image).
      - name: Isolated-deploy build simulation (#662, #93)
        if: env.RUN == 'true'
        working-directory: .
        run: scripts/deploy-web-harness.sh --build-only

      # Three of web-harness's own tests reach across the repo for their
      # browser: pluginProvenanceRendered, pluginSandboxRendered and
      # popupDismissalRendered all do
      #   createRequire(...)(resolve(repoRoot, 'apps/desktop/node_modules/playwright'))
      # at module load (#71). Without apps/desktop's install they do not merely
      # skip -- the whole test FILE fails with "Cannot find module", which is
      # exactly what this gate's own first run reported (3 failures, PR #83).
      # ci.yml's web-harness job has the same gap and has not been run since
      # those tests landed.
      - name: Install apps/desktop deps (web-harness rendered tests require its playwright)
        if: env.RUN == 'true'
        working-directory: apps/desktop
        run: npm ci

      - name: Install Chromium headless shell + Linux deps
        if: env.RUN == 'true'
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium-headless-shell

      - if: env.RUN == 'true'
        run: npm test

  plugins:
    name: Plugins typecheck + tests
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN: ${{ needs.changes.outputs.frontend }}
    defaults:
      run:
        working-directory: plugins
    steps:
      - name: Not applicable
        if: env.RUN != 'true'
        working-directory: .
        run: echo "No frontend-relevant paths changed in this PR; the plugins gate is not applicable."

      - uses: actions/checkout@v7
        if: env.RUN == 'true'
      - uses: actions/setup-node@v7
        if: env.RUN == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/package-lock.json

      - if: env.RUN == 'true'
        run: npm ci

      - if: env.RUN == 'true'
        run: npx tsc --noEmit -p sdk/tsconfig.json

      - if: env.RUN == 'true'
        run: npm test
