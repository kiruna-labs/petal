# Companion to rust-gate.yml. Branch protection on main REQUIRES the two
# checks below, but rust-gate.yml only runs when Rust-relevant paths change.
# A required check that never reports leaves the PR stuck at "Expected --
# waiting for status" forever -- docs-only and npm-only PRs could never merge
# (seen 2026-09-06 on the first batch of public PRs).
#
# This workflow uses the exact INVERSE path filter (`paths-ignore` with the
# same list), so for any PR exactly one of the two workflows runs and reports
# the required check names. Keep the two lists identical.
# GitHub's documented pattern: "Handling skipped but required checks".
name: Rust PR Gate (not applicable)

on:
  pull_request:
    paths-ignore:
      - ".github/workflows/rust-gate.yml"
      - ".github/workflows/ci.yml"
      - "scripts/ci-local.sh"
      - "apps/desktop/src-tauri/**"
      - "contracts/**"
      - "backend/**"

permissions:
  contents: read

jobs:
  rust:
    name: Rust build + lib tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "No Rust-relevant paths changed in this PR; the Rust gate is not applicable."
  windows:
    name: Windows build + lib tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "No Rust-relevant paths changed in this PR; the Windows gate is not applicable."
