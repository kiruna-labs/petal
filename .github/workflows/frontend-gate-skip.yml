# Companion to frontend-gate.yml, same pattern as rust-gate-skip.yml.
#
# frontend-gate.yml only runs when frontend-relevant paths change. If any of its
# check names is ever added to branch protection on `main`, a PR that touches
# none of those paths would otherwise sit at "Expected -- waiting for status"
# forever (seen 2026-09-06 on the first batch of public PRs, which is why
# rust-gate-skip.yml exists).
#
# This workflow uses the exact INVERSE path filter (`paths-ignore` with the same
# list), so for any PR exactly one of the two workflows runs and reports the
# three check names. KEEP THE TWO LISTS IDENTICAL.
# GitHub's documented pattern: "Handling skipped but required checks".
#
# NOTE: as of this workflow landing, branch protection requires only
# `Rust build + lib tests` and `Windows build + lib tests`. The three names
# below are NOT required yet -- this companion ships now so that making them
# required is a branch-protection change alone, with no second PR.
name: Frontend PR Gate (not applicable)

on:
  pull_request:
    # KEEP THIS LIST IDENTICAL to frontend-gate.yml's `paths`.
    paths-ignore:
      - ".github/workflows/frontend-gate.yml"
      - "apps/desktop/src/**"
      - "apps/desktop/tests/**"
      - "apps/desktop/scripts/**"
      - "apps/desktop/static/**"
      - "apps/desktop/package.json"
      - "apps/desktop/package-lock.json"
      - "apps/desktop/svelte.config.js"
      - "apps/desktop/vite.config.js"
      - "apps/desktop/tsconfig.json"
      - "shared/**"
      - "web-harness/**"
      - "plugins/**"

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop frontend build + tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "No frontend-relevant paths changed in this PR; the desktop frontend gate is not applicable."
  web-harness:
    name: Web-harness build + tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "No frontend-relevant paths changed in this PR; the web-harness gate is not applicable."
  plugins:
    name: Plugins typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "No frontend-relevant paths changed in this PR; the plugins gate is not applicable."
