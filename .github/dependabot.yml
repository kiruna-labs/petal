# Dependabot version updates (llitllit/petal#928).
#
# Without this file Dependabot only ALERTS; it never opens update PRs, which is
# how the public repo reached 46 open advisories with zero pull requests. One
# entry per manifest, weekly, with non-major updates GROUPED so a quiet week
# is one reviewable PR per ecosystem rather than one per package. Majors stay
# separate PRs on purpose: they are the ones that need a human to read the
# changelog.
#
# Security updates (the alert-driven PRs) are a repo setting, not this file:
#   Settings > Code security > Dependabot security updates -- enabled alongside
#   this commit via `gh api -X PUT repos/kiruna-labs/petal/automated-security-fixes`.
#
# Every Dependabot PR that touches a lockfile trips the SBOM freshness gate
# (.github/workflows/sbom.yml) until `bash scripts/generate-sbom.sh` is run and
# committed on the PR branch -- that is intended: a lockfile change must land
# with its SBOM.
version: 2

updates:
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      desktop-non-major:
        update-types: [minor, patch]
    labels: [dependencies, area:desktop]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-non-major:
        update-types: [minor, patch]
    labels: [dependencies, area:backend]

  - package-ecosystem: npm
    directory: /web-harness
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-harness-non-major:
        update-types: [minor, patch]
    labels: [dependencies, area:web-harness]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      site-non-major:
        update-types: [minor, patch]
    labels: [dependencies, area:site]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Pinned by wry/tauri 2.11 (they still require the 0.38 windows-core
      # line); a newer webview2-com brings a second `windows_core::Interface`
      # into the graph and the Windows build fails. Lift when Tauri moves.
      - dependency-name: webview2-com
    groups:
      cargo-non-major:
        update-types: [minor, patch]
    labels: [dependencies, area:desktop]
    ignore:
      # Pinned to the copy the vendored livekit fork resolves; a bump adds a
      # second tungstenite + RustCrypto generation (#29).
      - dependency-name: tokio-tungstenite
      # Exists only to re-enable `std` on the copy `windows` uses; bump with
      # windows/windows-core, never alone (#30).
      - dependency-name: windows-future
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Must match the vendored livekit fork's protocol generation (#31).
      - dependency-name: livekit-api
        update-types: [version-update:semver-major, version-update:semver-minor]

  # No entry for apps/desktop/src-tauri/harness: it is its own workspace with
  # `desktop = { path = ".." }`, so Dependabot run there rewrites the APP's
  # Cargo.toml while updating only the harness lock (#32, #33 -- always red).
  # Regenerate harness/Cargo.lock by hand when the app lock moves.

  # Pinned action versions in the workflows (checkout, setup-node, rust
  # toolchain, upload-artifact ...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types: [minor, patch]
    labels: [dependencies, area:ci]
