<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rendered Petal View region selector fixture</title>
  </head>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #desktop-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    body[data-region-background='light'] #desktop-backdrop {
      background: #f5f6f7;
    }

    body[data-region-background='dark'] #desktop-backdrop {
      background: #0a0a0b;
    }

    body[data-region-background='mixed'] #desktop-backdrop {
      background:
        linear-gradient(135deg, #f5f6f7 0 50%, #0a0a0b 50% 100%),
        repeating-conic-gradient(#f5f6f7 0 25%, #0a0a0b 0 50%) 0 / 24px 24px;
      background-blend-mode: multiply;
    }

    #app {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
    }
  </style>
  <body data-region-background="light">
    <div id="desktop-backdrop" aria-hidden="true"></div>
    <div id="app"></div>
    <script type="module" src="./region-window.js"></script>
  </body>
</html>
