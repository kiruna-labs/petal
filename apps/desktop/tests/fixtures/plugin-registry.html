<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --font-ui: Arial, sans-serif;
        --font-mono: monospace;
        --surface: #17191d;
        --text-primary: #f5f6f7;
        --text-muted: #b8bcc5;
        --text-faint: #8c929e;
        --fill-weak: rgba(255, 255, 255, 0.05);
        --hairline: rgba(255, 255, 255, 0.08);
        --danger: #ff8d8d;
        --radius-chip: 6px;
        --radius-tile: 10px;
        --radius-pill: 999px;
        --shadow-inset-hairline: inset 0 0 0 1px #333842;
        --focus-ring: #6e8bff;
        --focus-ring-width: 2px;
        --focus-ring-offset: 2px;
        --disabled-opacity: 0.5;
        --motion-fast: 100ms;
        --ease-standard: ease;
      }
      html, body, #app { width: 100%; margin: 0; }
      body { background: #0d0f12; }
      #app { box-sizing: border-box; padding: 0 20px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./plugin-registry.js"></script>
  </body>
</html>
