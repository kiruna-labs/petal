<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --font-ui: Arial, sans-serif;
        --font-mono: monospace;
        --surface: #17191d;
        --surface-raised: #30343b;
        --text-primary: #f5f6f7;
        --text-muted: #b8bcc5;
        --text-faint: #8c929e;
        --hairline-strong: #59606c;
        --danger: #ff8d8d;
        --danger-tint-12: rgba(255, 91, 91, 0.12);
        --danger-tint-16: rgba(255, 91, 91, 0.16);
        --danger-tint-25: rgba(255, 91, 91, 0.25);
        --warning: #e8b84b;
        --live-bright: #7ff0a3;
        --live-tint: rgba(127, 240, 163, 0.12);
        --id-blue: #6e8bff;
        --radius-chip: 6px;
        --radius-tile: 10px;
        --radius-pill: 999px;
        --motion-fast: 100ms;
        --ease-standard: ease;
        --shadow-inset-hairline: inset 0 0 0 1px #333842;
        --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.3);
      }
      html,
      body,
      #app {
        width: 100%;
        margin: 0;
      }
      body {
        background: #0d0f12;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./ai-chat-panel.js"></script>
  </body>
</html>
